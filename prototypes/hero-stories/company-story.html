    if (t < h - 1.8 || t > h + 2.7) return; const v = visitors[i % 2], st = visitorAt(h, t);
    v.g.visible = st.op > 0.04; v.g.position.copy(st.pos); v.g.rotation.y = st.face; pose(v, st.p); v.mat.opacity = st.op; v.sh.material.opacity = st.op; v.mat.color.set(CLAY[(i * 2 + 2) % CLAY.length]);
  });
  world.updateMatrixWorld(true);

  // the phone: the team's shared pipeline
  const pk = ease(span(t, 35.6, 36.8)), pin0 = easeOut(span(t, 22.4, 23.6));
  phoneG.visible = t > 22.2 && t < 37.0;
  phoneG.position.copy(PHONE_POS).add(new Vector3(0.1 * pk, -0.2 * pk + (1 - pin0) * 0.6, -1.2 * pk)); phoneG.scale.setScalar(PS * (1 - 0.4 * pk) * Math.max(0.0001, pin0));
  pMat.opacity = glassMat.opacity = scrMat.opacity = sheenMat.opacity = (1 - pk) * pin0;
  let ns = 0, nf = 0; ROWS.forEach((r) => { if (t > r.shake + 1.5) (r.where === 'stand' ? ns++ : nf++); });
  const rush = ease(span(t, 32.6, 34.6)); ns += Math.round(rush * 38); nf += Math.round(rush * 17);
  if (redraw && phoneG.visible) drawScreen(ns, nf);

  // rows: from the handshake into the phone, then onto the board, then (clients) home to the tower
  const handOf = (h) => { const v = new Vector3(); h.R.hand.getWorldPosition(v); world.worldToLocal(v); return v; };
  const hands = { stand: handOf(sa), floor: handOf(sb) };
  for (const r of ROWS) {
    const t0 = r.shake + 0.3, t1 = r.shake + 1.55;
    if (t < t0) { r.m.visible = false; continue; }
    const st = t > 35.8 ? boardState(r, t) : { col: 0, age: 0, warm: 0, gold: 0, jit: 0, client: false };
    r.client = st.client;
    const fly = easeOut(span(t, t0, t1)), slot = phoneLocal(0, pxY(slotY(r)));
    let pos, q, s, op = 1;
    if (fly < 1) { pos = hands[r.where].clone().lerp(slot, fly); pos.y += Math.sin(Math.PI * fly) * 0.55; q = new Quaternion().slerp(PHONE_Q, fly); s = mix(0.3, PS, fly); }
    else { pos = slot; q = PHONE_Q.clone(); s = PS; }
    const lk = ease(span(t, 35.8 + r.slot * 0.12, 36.9 + r.slot * 0.12));
    const boardPos = new Vector3(colX(Math.min(4, st.col)), laneY(r.slot), BOARD.z);
    if (lk > 0) { pos = pos.clone().lerp(boardPos, lk); pos.z += Math.sin(Math.PI * lk) * 0.4; q = q.clone().slerp(new Quaternion(), lk); s = mix(s, BS, lk); }
    if (t > 52.0) {
      const j = ['karim', 'hamad', 'faris'].indexOf(r.id);
      if (j < 0) op = 1 - ease(span(t, 52.0, 52.6));
      else { const k = span(t, 52.3 + j * 0.45, 54.4 + j * 0.45), e = ease(k), to = towerFace([1, 2, 4][j]); pos = boardPos.clone().lerp(to, e); pos.y += Math.sin(Math.PI * e) * 1.3; s = mix(BS, 0.14, ease(span(k, 0.55, 1))); op = 1 - ease(span(k, 0.88, 1)); }
    }
    r.m.visible = op > 0.01; r.m.position.copy(pos); r.m.quaternion.copy(q); r.m.scale.setScalar(s); r.m.material.opacity = op;
    r.pos = pos;
    if (redraw && r.m.visible) paintRow(r, st);
  }
  const colK = ease(span(t, 35.9, 36.8)) * (1 - ease(span(t, 52.0, 52.8)));
  colMats.forEach((m, i) => { m.opacity = colK * (i === 4 ? 0.16 : 0.07); });

  // the lead agent and its helpers
  const lIn = easeOut(span(t, 12.2, 14.0));
  const lp = LEAD_A.clone(); lp.y += (1 - lIn) * 2.4;
  lp.lerp(LEAD_B3, ease(span(t, 22.0, 23.6))).lerp(LEAD_B4, ease(span(t, 35.4, 36.8))).lerp(LEAD_A5, ease(span(t, 52.0, 54.4)));
  lp.y += Math.sin(T * 1.1) * 0.05;
  const lVis = lIn * (1 - ease(span(t, 65.0, 65.8)));
  placeBot(lead, lp, lVis, T, 0);
  drawVisor(lead, T, t > 56.2 && t < 65 ? 'smile' : 'think');
  const head = new Vector3(); team[0].neck.getWorldPosition(head); world.worldToLocal(head);
  const bubbleAt = head.clone().add(new Vector3(-0.05, 0.6, 0));
  const read = bump(t, 14.3, 16.0, 0.3);
  if (read > 0) setTube(beam, new QuadraticBezierCurve3(lp.clone().add(new Vector3(-0.15, -0.1, 0.1)), lp.clone().lerp(bubbleAt, 0.5).add(new Vector3(0, 0.3, 0)), bubbleAt.clone().add(new Vector3(0.3, 0.3, 0))), ease(span(t, 14.3, 14.8)), 0.006); else beam.visible = false;
  beam.material.opacity = read;
  helpers.forEach((hb, i) => {
    const kA = easeOut(span(t, 15.6 + i * 0.2, 16.9 + i * 0.2)), backA = ease(span(t, 21.0 + i * 0.1, 22.0 + i * 0.1));
    const kB = easeOut(span(t, 36.4 + i * 0.2, 37.7 + i * 0.2)), kO = ease(span(t, 52.0 + i * 0.1, 54.6 + i * 0.1));
    let p = lp.clone(), s = 0;
    if (t < 22.2) { p = lp.clone().lerp(HELP_A[i], kA).lerp(lp, backA); s = kA > 0 && backA < 1 ? mix(0.2, 1, kA) * (1 - 0.8 * backA) : 0; }
    else if (t > 36.3) {
      p = lp.clone().lerp(HELP_B4[i], kB); s = kB > 0 ? mix(0.2, 1, kB) : 0;
      if (kO > 0) { const home = HELP_A[i].clone().add(new Vector3(0, 0.05 * Math.sin(T * 1.3 + i), 0)); p.lerp(home, kO); }
      s *= 1 - ease(span(t, 65.0, 65.8));
    }
    p.y += Math.sin(T * 2 + i) * 0.03;
    placeBot(hb, p, s, T, i * 1.7); hb.g.rotation.y += -0.3; drawVisor(hb, T, 'icon'); hb.pos = p;
    const chipOp = t < 22.2 ? ease(span(t, 16.6 + i * 0.2, 17.1 + i * 0.2)) * (1 - backA) : t > 36.3 && t < 52.4 ? ease(span(t, 37.4 + i * 0.2, 37.9 + i * 0.2)) * (1 - ease(span(t, 51.8, 52.4))) : 0;
    pin(skillEls[i], p.clone().add(new Vector3(0, -0.26, 0)), narrow() && t > 36 ? 0 : chipOp, -50, 0);
  });
  // research: the first helper scans each target on the list
  const scanJ = Math.floor((t - 17.6) / 0.55), scanK = (t - 17.6) / 0.55 - scanJ;
  if (t > 17.4 && t < 20.4 && scanJ >= 0 && scanJ < 5) {
    const tgt = new Vector3(PANEL_W / 2 - 0.2, PANEL_H / 2 - ((186 + scanJ * 64 + 27) / PNH) * PANEL_H, 0.02).applyMatrix4(panelM.matrix);
    const from = helpers[0].pos.clone().add(new Vector3(0, -0.1, 0.05));
    setTube(beam2, new QuadraticBezierCurve3(from, from.clone().lerp(tgt, 0.5).add(new Vector3(0.1, 0.1, 0.2)), tgt), 1, 0.005); beam2.material.opacity = Math.sin(Math.PI * scanK) * 0.9;
  } else beam2.visible = false;
  // ropes: thrown, pulled taut, hauled forward a stage, let go
  ropes.forEach(({ r, at, helper, m }) => {
    const R = ROPE(at), hb = helpers[helper];
    const throwK = ease(span(t, ...R.throw)), rel = ease(span(t, ...R.rel));
    if (throwK <= 0 || rel >= 1 || !r.pos) { m.visible = false; return; }
    const port = hb.pos.clone().add(new Vector3(0, -0.12, 0.05));
    const end = r.pos.clone().add(new Vector3(SCW * BS / 2 - 0.06, 0, 0.04));
    const tense = ease(span(t, ...R.tense)), pull = ease(span(t, ...R.pull));
    const len = port.distanceTo(end), sag = len * (0.32 * (1 - tense) + 0.04 * (1 - pull)) + 0.01;
    const mid = port.clone().lerp(end, 0.5); mid.y -= sag; if (pull > 0) mid.y += Math.sin(pull * Math.PI * 4) * 0.03 * (1 - pull);
    const from = port.clone(), to = end.clone(); if (rel > 0) to.lerp(from, rel);
    setTube(m, new QuadraticBezierCurve3(from, mid, to), throwK, 0.012);
  });

  // ---- overlays
  const caps = [['Week 1', 36.8, 39.9], ['Month 1', 40.0, 44.9], ['Month 3', 45.0, 51.8]];
  let capTxt = '', capOp = 0; for (const [s, a, b] of caps) if (t >= a && t < b) { capTxt = s; capOp = bump(t, a, b, 0.25); }
  if (capTxt && capEl.textContent !== capTxt) capEl.textContent = capTxt;
  pin(capEl, new Vector3(colX(0) - 0.5, BOARD.y - 1.32, BOARD.z + 0.1), capOp, 0, 0, 'rotate(-3deg)');
  const done = t > 55;
  if (bubbleEl.dataset.k !== String(done)) { bubbleEl.innerHTML = done ? '<div class="h">This year</div><span class="tick">✓</span>Growing, with new clients from one show' : '<div class="h">Thinking…</div>How do we grow this year?'; bubbleEl.dataset.k = String(done); }
  bubbleEl.classList.toggle('glow', read > 0.2 || bump(t, 56.4, 58.0, 0.3) > 0.2);
  pin(bubbleEl, bubbleAt, Math.min(1, bump(t, 2.2, 16.2, 0.4) + bump(t, 55.8, 64.8, 0.4)), -30, -100);
  zoneEls.forEach((e, i) => pin(e, i === 0 ? SA_AT.clone().add(new Vector3(-0.15, 2.48, -0.95)) : new Vector3(CXB + 1.85, 2.48, -0.95), ease(span(t, 23.0 + i * 0.3, 23.6 + i * 0.3)) * (1 - ease(span(t, 34.8, 35.5))), -50, -100));
  colEls.forEach((e, i) => pin(e, new Vector3(colX(i), BOARD.y + 1.32, BOARD.z), ease(span(t, 36.2 + i * 0.1, 36.7 + i * 0.1)) * (1 - ease(span(t, 51.8, 52.4))), -50, -50));
  let di = -1, dk = 0; DRAFTS.forEach((d, i) => { const k = bump(t, d.t - 1.5, d.t + 0.9, 0.25); if (k > dk) { dk = k; di = i; } });
  if (di >= 0) {
    const d = DRAFTS[di], r = ROWS.find((x) => x.id === d.row), sent = t >= d.t;
    const html = sent ? `<b>Sent</b> · you said yes <span class="send">✓</span>` : `<b>${d.what}</b> — send? <span class="send">Send</span>`;
    if (draftEl.dataset.k !== html) { draftEl.innerHTML = html; draftEl.dataset.k = html; draftEl.classList.toggle('sent', sent); }
    const right = boardState(r, t).col > 2.6;
    pin(draftEl, r.pos.clone().add(new Vector3(right ? -SCW * BS / 2 + 0.05 : SCW * BS / 2 - 0.15, 0.14, 0.1)), dk, right ? -100 : 0, -100);
  } else pin(draftEl, new Vector3(), 0);

  renderer.render(scene, camera);
}

function size() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
size(); addEventListener('resize', size);

// ---- controls
let T = 0, paused = false;
const scenesEl = document.getElementById('scenes');
const still = q.has('t') || reduced;
NAMES.forEach((n, i) => { const b = document.createElement('button'); b.dataset.i = i; b.textContent = `${i + 1} ${n}`; b.onclick = () => { T = still ? KEY[i] : SC[i] + 0.05; if (still) { lastCopy = -2; lastDraw = -1; paint(T, true); } }; scenesEl.appendChild(b); });
const pp = document.createElement('button'); pp.className = 'pp'; pp.textContent = '❚❚'; pp.setAttribute('aria-label', 'Pause'); pp.onclick = () => { paused = !paused; pp.textContent = paused ? '▶' : '❚❚'; pp.setAttribute('aria-label', paused ? 'Play' : 'Pause'); };
if (!still) scenesEl.appendChild(pp);

await Promise.race([Promise.all(['600 34px Inter', '400 24px Inter', '700 54px Inter', '700 30px Caveat'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]);
LATE.forEach((f) => f());
if (still) {
  T = q.has('t') ? Number(q.get('t')) : KEY[q.has('scene') ? Number(q.get('scene')) - 1 : 0];
  if (q.has('px')) ptrX = tiltX = Number(q.get('px'));
  // settle row positions and helper positions used by ropes/pins: one warm-up pass
  paint(T, true); paint(T, true); window.__paint = (x) => { lastDraw = -1; paint(x, true); paint(x, true); }; window.__ready = true;
} else {
  if (q.has('scene')) T = SC[Number(q.get('scene')) - 1] + 0.05;
  const STEP = 1 / 60; let last = performance.now(), acc = 0;
  const loop = (now) => { const dt = Math.min(0.25, (now - last) / 1000); last = now; if (!paused) { acc += dt; while (acc >= STEP) { T += STEP; acc -= STEP; } } paint(T, false); requestAnimationFrame(loop); };
  requestAnimationFrame(loop); window.__ready = true;
}
</script>
