<script type="module">
// The Sadu loom: your network is a warp-faced Sadu cloth weaving itself on a ground loom. Each person is a warp stripe that
// runs the whole length of the loom. A neglected stripe goes slack: it lifts, ripples, loses its dye and wears thin.
// The assistant is the gold shuttle: its pass pulls slack stripes tight, and the colour comes back from the fell outward.
// A goal is a motif: two people's stripes outline a diamond that completes in the weave, then catches the light.
import {
  Scene, PerspectiveCamera, WebGLRenderer, HemisphereLight, DirectionalLight, Color, SRGBColorSpace, Vector3, Group,
  PlaneGeometry, CylinderGeometry, CapsuleGeometry, MeshStandardMaterial, MeshBasicMaterial, Mesh, ShaderMaterial, DoubleSide,

} from 'three';

const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
const dark = q.get('theme') === 'dark';
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SUN = new Color(css('--sun'));

// ---- the cloth
const COLS = 64, ROWS_VIS = 150, PAT_ROWS = 512, VF = 0.56, W = 3.2, L = 6.0, CURL = 0.07;
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const RED = hex('#8A2219'), BLACK = hex('#1E1A20'), CREAM = hex('#ECE0C6'), OCHRE = hex('#C98636'), GOLD = hex('#E2B85A');
const FADED = '#B9AC98';

// five people, each a stripe two warp ends wide
const PEOPLE = [
  { cols: [10, 11], c: CREAM }, { cols: [20, 21], c: BLACK }, { cols: [31, 32], c: OCHRE }, { cols: [42, 43], c: CREAM }, { cols: [52, 53], c: BLACK },
].map((p) => ({ ...p, slack: 0, slackT: 0, tight: 0, tightening: false, glint: 0 }));
const GAPS = [[12, 19], [22, 30], [33, 41], [44, 51]]; // red ground between neighbours: where motifs are woven
const personAt = {}; PEOPLE.forEach((p, i) => p.cols.forEach((c) => { personAt[c] = i; }));
function baseCol(c) {
  if (c === 0 || c === 4 || c === 59 || c === 63 || c === 5 || c === 58) return BLACK;
  if (c < 4 || c > 59) return CREAM;
  if (personAt[c] != null) return PEOPLE[personAt[c]].c;
  return RED;
}

// pattern rows are written as they are woven (a ring buffer), so motifs land where the weaving is when a goal happens
const pat = new Uint8Array(COLS * PAT_ROWS * 4);
const patTex = new DataTexture(pat, COLS, PAT_ROWS, RGBAFormat, UnsignedByteType); patTex.magFilter = patTex.minFilter = NearestFilter;
const base = new Uint8Array(COLS * 4);

const baseTex = new DataTexture(base, COLS, 1, RGBAFormat, UnsignedByteType); baseTex.magFilter = baseTex.minFilter = NearestFilter; baseTex.needsUpdate = true;

const colTex = new DataTexture(colState, COLS, 1, RGBAFormat, FloatType); colTex.magFilter = colTex.minFilter = NearestFilter;

const motifs = []; // { r0, g, a, b }
const MOTIF_ROWS = 17;
function writeRow(r) {
  const o = (r % PAT_ROWS) * COLS * 4;
  for (let c = 0; c < COLS; c++) {
    let col = baseCol(c), flag = 255;
    // the selvedge: "horse teeth" checks
    if ((c >= 1 && c <= 3) || (c >= 60 && c <= 62)) col = (c + Math.floor(r / 2)) % 2 ? BLACK : CREAM;
    // small eyes scattered in the red ground
    GAPS.forEach(([gl, gr], g) => {
      if (c < gl || c > gr) return;
      const cx = Math.floor((gl + gr) / 2), d = (r + g * 9) % 26;
      if (d < 5) { const half = 2 - Math.abs(d - 2), dx = Math.abs(c - cx); if (dx <= half) col = dx === 0 && half === 2 ? BLACK : CREAM; }
    });
    // goal motifs: a diamond outlined by the two neighbouring people's colours
    for (const m of motifs) {
      const d = r - m.r0; if (d < 0 || d >= MOTIF_ROWS) continue;
      const [gl, gr] = GAPS[m.g]; if (c < gl - 4 || c > gr + 4) continue;
      const cx = (gl + gr) / 2, hw = (gr - gl) / 2 + 3.2, k = 1 - Math.abs(d - 8) / 8, half = k * hw, dx = Math.abs(c - cx);
      if (dx <= half + 0.01) {
        flag = 128;
        const A = PEOPLE[m.g].c, B = PEOPLE[m.g + 1].c;
        if (dx > half - 2.2) col = c < cx ? A : B;
        else if (dx > half - 3.2) col = RED;
        else col = dx + Math.abs(d - 8) * 0.6 < 2.6 ? GOLD : (A === BLACK || B === BLACK ? CREAM : BLACK);
      }
    }
    pat.set([...col, flag], o + c * 4);
  }
  patTex.needsUpdate = true;
}

// ---- weaving state on simulated time
let T = 0, rows = 0; const events = [];
const at = (t, fn) => { events.push({ t, fn }); events.sort((a, b) => a.t - b.t); };
let pass = null, dir = 1, assistPending = false, motifGlow = 0, glowRange = [-100, -100];
const growthRows = Math.round(VF * ROWS_VIS) - 1;
function startPass() {
  let dur = 1.0, kind = 'weave';
  if (rows < growthRows) { dur = 0.05; kind = 'grow'; }
  else if (assistPending) { dur = 2.4; kind = 'assist'; assistPending = false; }
  else if (motifs.length && rows - motifs[motifs.length - 1].r0 < MOTIF_ROWS && rows >= motifs[motifs.length - 1].r0) dur = 0.5;
  writeRow(rows);
  pass = { t0: T, dur, kind, dir, crossed: new Set() };
}
// a motif already in the cloth before anyone arrives
motifs.push({ r0: 46, g: 1 });

function step(dt) {
  T += dt;
  while (events.length && events[0].t <= T) events.shift().fn();
  if (!pass) startPass();
  const p = (T - pass.t0) / pass.dur;
  if (pass.kind === 'assist') {
    const u = pass.dir > 0 ? p : 1 - p;
    PEOPLE.forEach((pp, i) => {
      const cu = (pp.cols[0] + 1) / COLS;
      if (!pass.crossed.has(i) && (pass.dir > 0 ? u >= cu : u <= cu)) { pass.crossed.add(i); if (pp.slack > 0.5) { pp.tightening = true; pp.slackT = 0; pp.glint = 1; } }
    });
  }
  if (p >= 1) {
    rows++; dir = -dir;
    const m = motifs[motifs.length - 1];
    if (m && rows === m.r0 + MOTIF_ROWS && m.glow) { motifGlow = 1; glowRange = [m.r0, m.r0 + MOTIF_ROWS]; }
    startPass();
  }
  for (const pp of PEOPLE) {
    if (pp.tightening) { pp.tight = Math.min(1, pp.tight + dt * 0.55); if (pp.tight >= 1) { pp.tightening = false; pp.slack = 0; pp.tight = 0; } }
    else pp.slack = pp.slack < pp.slackT ? Math.min(pp.slackT, pp.slack + dt * 0.35) : pp.slack;
    pp.glint = Math.max(0, pp.glint - dt * 0.45);
  }
  motifGlow = Math.max(0, motifGlow - dt * 0.4);
}

// the cycle: two stripes go slack, the shuttle tightens them, then two neighbours weave a diamond together
const CYCLE = 20, FIRST = 6.5;
function cycle(k) {
  const tc = FIRST + k * CYCLE;
  at(tc, () => { PEOPLE[(k * 2 + 1) % 5].slackT = 1; PEOPLE[(k * 2 + 3) % 5].slackT = 1; });
  at(tc + 5.5, () => { assistPending = true; });
  at(tc + 9, () => { motifs.push({ r0: rows + 1, g: k % 4, glow: true }); });
  at(tc + CYCLE - 0.2, () => cycle(k + 1));
}
cycle(0);

// ---- three
const canvas = document.getElementById('c');
const renderer = new WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.outputColorSpace = SRGBColorSpace;
const scene = new Scene();
const phone = innerWidth < 700;
const camera = new PerspectiveCamera(30, 1, 0.1, 60);
const CAM = phone ? new Vector3(0.6, 7.4, 9.0) : new Vector3(0.8, 5.6, 7.6), LOOK = new Vector3(0.15, -0.45, -2.7);
camera.position.copy(CAM); camera.lookAt(LOOK);
scene.add(new HemisphereLight(0xfff1dc, dark ? 0x0a2228 : 0x183f47, 1.3));
const LIGHT = new Vector3(-0.55, 0.9, 0.4).normalize();
const key = new DirectionalLight(0xfff0d8, 2.0); key.position.copy(LIGHT).multiplyScalar(8); scene.add(key);
const loom = new Group(); loom.position.set(0, 0, 0.6); scene.add(loom);

const radial = (stops, w = 128, h = 128) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); stops.forEach(([o, col]) => r.addColorStop(o, col)); g.fillStyle = r; g.fillRect(0, 0, w, h); return new CanvasTexture(c); };
// sand under the loom, fading into the field
const sand = new Mesh(new PlaneGeometry(14, 14), new MeshBasicMaterial({ map: radial([[0, dark ? 'rgba(201,162,122,.22)' : 'rgba(214,176,132,.34)'], [0.45, 'rgba(201,162,122,.10)'], [1, 'rgba(201,162,122,0)']]), transparent: true, depthWrite: false }));
sand.rotation.x = -Math.PI / 2; sand.position.set(0, -0.36, -L / 2); loom.add(sand);
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 128; const g = c.getContext('2d'); g.filter = 'blur(10px)'; g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(12, 10, 40, 108); return new CanvasTexture(c); })();
const shadow = new Mesh(new PlaneGeometry(W + 1.2, L + 1.4), new MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.set(0.25, -0.35, -L / 2 + 0.1); loom.add(shadow);

// the two beams of the ground loom
const wood = new MeshStandardMaterial({ color: dark ? 0x5a3d26 : 0x6e4a2c, roughness: 0.75 });
const R = 0.13, nearZ = -CURL * L;
const beamNear = new Mesh(new CylinderGeometry(R - 0.03, R - 0.03, W + 0.55, 24), wood); beamNear.rotation.z = Math.PI / 2; beamNear.position.set(0, -R, nearZ); loom.add(beamNear);
const beamFar = new Mesh(new CylinderGeometry(0.09, 0.09, W + 0.55, 20), wood); beamFar.rotation.z = Math.PI / 2; beamFar.position.set(0, -0.1, -L - 0.02); loom.add(beamFar);
for (const x of [-1, 1]) for (const z of [nearZ, -L - 0.02]) { const s = new Mesh(new CylinderGeometry(0.035, 0.03, 0.5, 10), wood); s.position.set(x * (W / 2 + 0.33), -0.2, z); loom.add(s); }

const cloth = new ShaderMaterial({
  side: DoubleSide,
  uniforms: {
    uT: { value: 0 }, uRows: { value: 0 }, uPass: { value: 0 }, uDir: { value: 1 }, uVF: { value: 0 },
    uPat: { value: patTex }, uBase: { value: baseTex }, uCol: { value: colTex },
    uCols: { value: COLS }, uRowsVis: { value: ROWS_VIS }, uPatRows: { value: PAT_ROWS }, uW: { value: W }, uL: { value: L }, uCurl: { value: CURL }, uR: { value: R },
    uLight: { value: LIGHT }, uFaded: { value: new Color(FADED) }, uGold: { value: SUN.clone() }, uGlow: { value: 0 }, uGlowRange: { value: [0, 0] },
  },
  vertexShader: /* glsl */`
    uniform float uT, uVF, uRowsVis, uW, uL, uCurl, uR; uniform sampler2D uCol;
    varying vec2 vUv; varying vec3 vN; varying vec3 vTan; varying vec3 vBit; varying vec3 vWorld;
    vec3 disp(vec2 uv) {
      float u = uv.x, v = uv.y;
      float woven = 1.0 - smoothstep(uVF - 0.012, uVF + 0.012, v);
      vec3 p = vec3((u - 0.5) * uW, 0.0, -v * uL);
      p.y += woven * smoothstep(uCurl, uCurl + 0.1, v) * (0.03 * sin(u * 6.5 + uT * 0.45 + v * 3.0) + 0.018 * sin(v * 10.0 - uT * 0.35));
      vec4 cs = texture2D(uCol, vec2(u, 0.5));
      float fromFell = (uVF - v) * uRowsVis;
      float s = fromFell > 0.0 ? cs.r * step(cs.g * uRowsVis * 1.2, fromFell) : cs.r * (1.0 - smoothstep(0.0, 0.15, cs.g));
      p.y += s * smoothstep(uCurl, uCurl + 0.1, v) * (0.045 + 0.035 * sin(v * 26.0 + uT * 1.4)) * (fromFell > 0.0 ? 1.0 : 0.7);

        p.z = -uCurl * uL + sin(a) * uR; p.y = (y0 - uR) + cos(a) * uR;
      }
      return p;
    }
    void main() {
      vUv = uv;
      vec3 p = disp(uv), pu = disp(uv + vec2(0.002, 0.0)), pv = disp(uv + vec2(0.0, 0.002));
      vec3 t = normalize(pu - p), b = normalize(pv - p), n = normalize(cross(t, b));

      vTan = normalize(mat3(modelMatrix) * t); vBit = normalize(mat3(modelMatrix) * b); vN = normalize(mat3(modelMatrix) * n);

      vec3 c; vec3 nb; float ao;
      float glint = cs.b;
      if (woven) {
        float s = cs.r * step(cs.g * uRowsVis * 1.2, fromFell);
        vec4 pc = texture2D(uPat, vec2((col + 0.5) / uCols, (mod(r, uPatRows) + 0.5) / uPatRows));
        c = pc.rgb;
        // warp-faced weave: each end shows as a little bead, alternate ends offset by half a pick
        float fv = fract(rowF + mod(col, 2.0) * 0.5);

        float se = pow(abs(d.x), 2.6) + pow(abs(d.y), 3.2), h = sqrt(max(0.0, 1.0 - se));
        float ply = sin((fu2 * 0.9 - fv * 1.5) * 18.85 + col * 1.3);
        nb = normalize(vec3(sign(d.x) * pow(abs(d.x), 1.6) * 0.9 + ply * 0.12, sign(d.y) * pow(abs(d.y), 2.2) * 0.7, h + 0.35));

        c *= 0.86 + 0.14 * (0.5 + 0.5 * ply);
        c = mix(c, uFaded, s * 0.8);
        if (s > 0.25 && hash(vec2(col, r)) < s * 0.32) { c *= 0.35; ao *= 0.6; } // worn thin

        c += uGold * glint * 0.55 * exp(-max(fromFell, 0.0) * 0.06);
      } else {
        // bare warp from the fell to the far beam
        float s = cs.r * (1.0 - smoothstep(0.0, 0.15, cs.g));
        float fu2 = fu + s * 0.34 * sin(rowF * 0.45 + col * 1.7 + uT);
        float x = (fu2 - 0.5) / 0.2;
        if (abs(x) > 1.0) discard;
        c = texture2D(uBase, vec2((col + 0.5) / uCols, 0.5)).rgb;
        c = mix(c, uFaded, s * 0.8);
        nb = normalize(vec3(x, 0.0, sqrt(1.0 - x * x) + 0.1));
        ao = 0.8;
        c *= 0.9 + 0.1 * sin(rowF * 6.0 + col);
        c += uGold * glint * 0.5;
      }
      c *= 0.9 + 0.1 * hash(floor(vUv * vec2(uCols * 9.0, uRowsVis * 7.0)));

const clothMesh = new Mesh(new PlaneGeometry(1, 1, 96, 170), cloth);
// PlaneGeometry uv: x 0..1 left→right, y 0..1 bottom→top: we use uv only, positions come from disp()
clothMesh.frustumCulled = false; loom.add(clothMesh);

// the shuttle: a slim gold stick with a soft glow
const shuttle = new Group();
const shuttleBody = new Mesh(new CapsuleGeometry(0.03, 0.36, 6, 16), new MeshStandardMaterial({ color: SUN, metalness: 0.55, roughness: 0.28, emissive: SUN, emissiveIntensity: 0.25 }));
shuttleBody.rotation.z = Math.PI / 2; shuttleBody.scale.set(1, 1, 0.75); shuttle.add(shuttleBody);
const glowTex = radial([[0, 'rgba(255,238,190,1)'], [0.25, 'rgba(240,200,110,.45)'], [1, 'rgba(240,200,110,0)']]);
const glow = new Sprite(new SpriteMaterial({ map: glowTex, blending: AdditiveBlending, depthWrite: false, transparent: true })); shuttle.add(glow);
loom.add(shuttle);

// ---- frame
let ptrX = 0, ptrY = 0, tiltX = 0, tiltY = 0;
addEventListener('pointermove', (e) => { ptrX = e.clientX / innerWidth * 2 - 1; ptrY = e.clientY / innerHeight * 2 - 1; });
function paint() {

  loom.rotation.y = -0.32 + Math.sin(T * 0.06) * 0.05 + tiltX * 0.12; loom.rotation.x = tiltY * 0.03;
  const p = Math.min(1, (T - pass.t0) / pass.dur);

  const u = cloth.uniforms;
  u.uT.value = T; u.uRows.value = rows; u.uPass.value = p; u.uDir.value = pass.dir; u.uVF.value = vF;
  u.uGlow.value = motifGlow; u.uGlowRange.value = glowRange;

    colState.set(pp ? [pp.slack, pp.tight, pp.glint, 0] : [0, 0, 0, 0], c * 4);
  }
  colTex.needsUpdate = true;
  // the shuttle rides the fell, a little beyond the selvedges at each end
  const su = -0.07 + (pass.dir > 0 ? p : 1 - p) * 1.14;
  const assist = pass.kind === 'assist';
  shuttle.position.set((su - 0.5) * W, 0.07 + Math.sin(Math.PI * p) * 0.04, -vF * L);
  shuttle.visible = pass.kind !== 'grow';

  glow.scale.setScalar(assist ? 1.3 : pass.kind === 'grow' ? 0.0 : 0.5);

}

function size() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
size(); addEventListener('resize', size);

const still = q.has('t') || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) {

} else {
  let last = performance.now();
  const loop = (now) => { { let dt = Math.min(0.25, (now - last) / 1000); while (dt > 0) { step(Math.min(dt, 1 / 30)); dt -= 1 / 30; } }; last = now; paint(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop); window.__ready = true;
}
