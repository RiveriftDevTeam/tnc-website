<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living web hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --field: #0B3A44; --ink: #F3EADB; --thread: #10A396; --sun: #E9C46A; --faded: #9AA5A3; }
  :root[data-theme="dark"] { --field: #08262D; --ink: #E8F1EF; --thread: #4FD1C5; --sun: #F0CF7E; --faded: #3E4A4C; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--field); color: var(--ink); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  header { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 22px 64px; font-size: 15px; z-index: 3; }
  header b { font-family: 'Bricolage Grotesque', system-ui; font-size: 20px; }
  header nav { display: flex; gap: 28px; opacity: .8; }
  .hero { position: relative; height: 100vh; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: center; padding: 0 64px; }
  .copy { position: relative; z-index: 2; max-width: 520px; }
  h1 { font-family: 'Bricolage Grotesque', system-ui; font-weight: 700; font-size: clamp(40px, 5vw, 72px); line-height: 1.02; letter-spacing: -.025em; }
  .copy p { margin-top: 22px; font-size: 18px; line-height: 1.55; opacity: .82; }
  .ctas { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { padding: 14px 22px; border-radius: 999px; font-weight: 500; font-size: 16px; }
  .btn.p { background: var(--sun); color: #14201F; }
  .btn.s { border: 1.5px solid rgb(243 234 219 / .4); }
  .stage { position: relative; height: 100%; }
  canvas { position: absolute; top: 0; bottom: 0; left: -10%; width: 118%; height: 100%;
    -webkit-mask-image: radial-gradient(50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(50% 50% at 50% 50%, #000 62%, transparent 100%); }
  @media (max-width: 700px) {
    header { padding: 18px 20px; } header nav { display: none; }
    .hero { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 92px 20px 0; align-items: start; }
    h1 { font-size: 40px; } .copy p { font-size: 16px; margin-top: 14px; } .ctas { margin-top: 20px; }
    canvas { left: -5%; width: 110%; }
  }
</style>
</head>
<body>
<header><b>TapNConnect</b><nav><span>How it works</span><span>For organisers</span><span>Pricing</span><span>Order</span></nav></header>
<section class="hero">
  <div class="copy">
    <h1>Stay close to the people you meet.</h1>
    <p>Every tap becomes a thread, and an assistant keeps each one alive: it remembers who people are and what you promised, and tells you when a word would count.</p>
    <div class="ctas"><span class="btn p">Start free</span><span class="btn s">Order for your company</span></div>
  </div>
  <div class="stage" id="stage"><canvas id="c"></canvas></div>
</section>

<script type="importmap">{ "imports": { "three": "../../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
import {
  Scene, PerspectiveCamera, WebGLRenderer, HemisphereLight, DirectionalLight, Color, SRGBColorSpace, Vector3, Group, Fog,
  CapsuleGeometry, SphereGeometry, MeshStandardMaterial, MeshBasicMaterial, Mesh, PlaneGeometry, CircleGeometry, TubeGeometry, LineCurve3,
  InstancedMesh, InstancedBufferAttribute, DynamicDrawUsage, Matrix4, CanvasTexture, Sprite, SpriteMaterial, AdditiveBlending,
} from 'three';

const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
const dark = q.get('theme') === 'dark', coral = q.get('thread') === 'coral';
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FIELD = new Color(css('--field')), SUN = new Color(css('--sun')), FADED = new Color(css('--faded'));
const WARM = new Color(coral ? (dark ? '#F08A70' : '#E2725B') : css('--thread'));
const YOU = new Color(coral ? (dark ? '#F08A70' : '#E07A5F') : (dark ? '#3CC4B7' : '#14A89A'));
const CLAY = (dark ? ['#D2BC98', '#8CC5BB', '#D9B4A4', '#6FA4C4', '#B8A88A'] : ['#E9D3AE', '#9ED9CF', '#F1C9B8', '#7FB8D9', '#CDBB9C']).map((h) => new Color(h));

// ---- the people: close friends near, old contacts far; the last four join later, through introductions
const PEOPLE = [
  ['You', 0, 0, 0],
  ['Omar', 1.5, 25, 0.6], ['Sara', 1.6, 150, 1.0], ['Mira', 1.9, 262, 1.4], ['Tariq', 2.3, 92, 1.8],
  ['Yusuf', 2.9, 200, 2.2], ['Lina', 3.0, 328, 2.6], ['Karim', 3.6, 168, 3.0], ['Noor', 3.9, 232, 3.4],
  ['Ali', 4.0, 298, 3.8], ['Rana', 3.7, 50, 4.2], ['Sami', 4.3, 128, 4.6],
  ['Huda', 3.3, 2, null], ['Layla', 3.2, 120, null], ['Faris', 3.4, 282, null], ['Dana', 4.3, 72, null],
];
const INTROS = [['Omar', 'Huda'], ['Sara', 'Layla'], ['Mira', 'Faris'], ['Tariq', 'Dana']];
const KNOWS = [['Sara', 'Tariq'], ['Omar', 'Rana'], ['Yusuf', 'Karim'], ['Mira', 'Ali'], ['Noor', 'Karim'], ['Lina', 'Ali'], ['Omar', 'Lina']];
const QUIET_FIRST = ['Yusuf', 'Karim', 'Noor', 'Ali', 'Sami', 'Lina'];

const by = {};
const people = PEOPLE.map(([name, r, deg, join], i) => {
  const a = deg * Math.PI / 180;
  const p = { name, i, x: r * Math.cos(a), z: r * Math.sin(a), join, rise: 0, riseT: 0, flash: 0, goal: 0, goalT: 0,
    scale: i === 0 ? 1.22 : 0.98 - r * 0.03, phase: i * 1.7, base: i === 0 ? YOU.clone() : CLAY[(i * 3) % CLAY.length].clone(), chest: new Vector3() };
  by[name] = p; return p;
});
by.You.rise = by.You.riseT = 1;

const threads = [];
const mkThread = (a, b, kind) => { const t = { a: by[a], b: by[b], kind, draw: 0, drawT: 0, drawSpd: 1.3, warm: 1, warmT: 1, warmSpd: 0.5, flash: 0, gold: 0 }; threads.push(t); return t; };
const mine = {}; people.slice(1).forEach((p) => { mine[p.name] = mkThread('You', p.name, 'mine'); });
const intro = {}; INTROS.forEach(([v, n]) => { intro[n] = mkThread(v, n, 'intro'); });
const knows = KNOWS.map(([a, b]) => mkThread(a, b, 'knows'));

// ---- the schedule: an event queue on simulated time
let T = 0; const events = [];
const at = (t, fn) => { events.push({ t, fn }); events.sort((x, y) => x.t - y.t); };
const pulses = [];
const pulse = (from, to, dur, onArrive) => pulses.push({ a: by[from], b: by[to], t0: T, dur, onArrive });

// growth: people rise around you one by one, and the thread draws to each
people.forEach((p) => { if (p.join == null || p.i === 0) return; at(p.join, () => { p.riseT = 1; }); at(p.join + 0.45, () => { mine[p.name].drawT = 1; }); });
knows.forEach((k) => at(Math.max(k.a.join, k.b.join) + 1.3, () => { k.drawT = 1; }));
// time passes: the far threads go quiet
QUIET_FIRST.forEach((n, j) => at(7 + j * 0.35, () => { Object.assign(mine[n], { warmT: 0, warmSpd: 0.32 }); }));

const CYCLE = 15, FIRST = 10.5;
function cycle(k) {
  const tc = FIRST + k * CYCLE;
  // the assistant: two quiet threads brought back, one pulse at a time
  at(tc + 0.3, () => reviveNext(k, 0));
  at(tc + 3.2, () => reviveNext(k, 1));
  // a goal: an introduction through someone you already know
  at(tc + 6.4, () => {
    const [via, who] = INTROS[k % INTROS.length], n = by[who];
    pulse('You', via, 1.3, () => {
      by[via].flash = 1;
      n.riseT = 1;
      const th = intro[who]; th.draw = 0; th.drawT = 1; th.drawSpd = 1 / 1.3; th.gold = 1; th.warm = th.warmT = 1;
      pulse(via, who, 1.3, () => {
        n.flash = 1; n.goal = 1; n.goalT = 0.35;
        at(T + 0.7, () => { const m = mine[who]; m.drawT = 1; m.drawSpd = 0.9; m.warm = m.warmT = 1; });
      });
    });
  });
  // and time keeps passing: two more threads slowly go quiet
  at(tc + 11.5, () => {
    const warm = Object.values(mine).filter((t) => t.draw > 0.99 && t.warmT === 1 && !['Omar', 'Sara'].includes(t.b.name));
    for (let j = 0; j < 2 && warm.length; j++) { const t = warm.splice((k * 3 + j * 5) % warm.length, 1)[0]; Object.assign(t, { warmT: 0, warmSpd: 0.25 }); }
  });
  at(tc + CYCLE - 0.5, () => cycle(k + 1));
}
function reviveNext(k, j) {
  const quiet = Object.values(mine).filter((t) => t.draw > 0.99 && t.warmT === 0);
  if (!quiet.length) return;
  const t = quiet[(k + j * 2) % quiet.length]; t.warmT = 0.001; // claimed
  pulse('You', t.b.name, 1.7, () => { Object.assign(t, { warmT: 1, warmSpd: 1.1, flash: 1 }); t.b.flash = 1; });
}
cycle(0);

// ---- three
const stage = document.getElementById('stage'), canvas = document.getElementById('c');
const renderer = new WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.outputColorSpace = SRGBColorSpace;
const scene = new Scene(); scene.fog = new Fog(FIELD, 13, 23);
const phone = innerWidth < 700;
const camera = new PerspectiveCamera(33, 1, 0.1, 60);
camera.position.set(0, phone ? 6.2 : 4.6, phone ? 17.5 : 15.2); camera.lookAt(0, 0.25, 0);
scene.add(new HemisphereLight(0xfff4e2, dark ? 0x0a2a30 : 0x1b4a52, 1.45));
const key = new DirectionalLight(0xfff1d6, 1.8); key.position.set(-4, 7, 5); scene.add(key);
const world = new Group(); scene.add(world);

const radial = (stops) => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); stops.forEach(([o, col]) => r.addColorStop(o, col)); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new CanvasTexture(c); };
const groundC = FIELD.clone().lerp(WARM, 0.16).getHexString();
const ground = new Mesh(new CircleGeometry(6.5, 64), new MeshBasicMaterial({ map: radial([[0, `#${groundC}cc`], [0.5, `#${groundC}55`], [1, `#${groundC}00`]]), transparent: true, depthWrite: false, fog: false }));
ground.rotation.x = -Math.PI / 2; world.add(ground);

const rim = (m) => { m.onBeforeCompile = (s) => { s.fragmentShader = s.fragmentShader.replace('#include <dithering_fragment>', 'float rimF = pow(1.0 - max(dot(normalize(vNormal), normalize(vViewPosition)), 0.0), 2.4);\n gl_FragColor.rgb += rimF * 0.26;\n#include <dithering_fragment>'); }; return m; };
const shadowTex = radial([[0, 'rgba(0,0,0,.5)'], [1, 'rgba(0,0,0,0)']]);
const glowTex = radial([[0, 'rgba(255,240,200,1)'], [0.22, 'rgba(240,200,110,.5)'], [1, 'rgba(240,200,110,0)']]);
const bodyG = new CapsuleGeometry(0.2, 0.28, 4, 18), headG = new SphereGeometry(0.15, 24, 16), shadowG = new PlaneGeometry(0.9, 0.9);
const glowSprite = (s = 1) => { const sp = new Sprite(new SpriteMaterial({ map: glowTex, blending: AdditiveBlending, depthWrite: false, transparent: true })); sp.scale.setScalar(s); world.add(sp); return sp; };

people.forEach((p) => {
  p.g = new Group(); p.mat = rim(new MeshStandardMaterial({ roughness: 0.85 }));
  const body = new Mesh(bodyG, p.mat); body.position.y = 0.34; const head = new Mesh(headG, p.mat); head.position.y = 0.82;
  p.shadow = new Mesh(shadowG, new MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })); p.shadow.rotation.x = -Math.PI / 2;
  p.g.add(body, head); world.add(p.g, p.shadow);
  p.flashS = glowSprite(0); p.goalS = glowSprite(0);
  p.goalBead = new Mesh(new SphereGeometry(0.05, 16, 12), new MeshBasicMaterial({ color: SUN })); world.add(p.goalBead);
});
const youGlow = glowSprite(1.6);

// threads: one straight unit tube, sagged and thinned in the vertex shader, one draw call
const unit = new TubeGeometry(new LineCurve3(new Vector3(0, 0, 0), new Vector3(1, 0, 0)), 48, 1, 6);
const N = threads.length;
const aDraw = new InstancedBufferAttribute(new Float32Array(N), 1), aSag = new InstancedBufferAttribute(new Float32Array(N), 1);
const aRad = new InstancedBufferAttribute(new Float32Array(N), 1), aGlow = new InstancedBufferAttribute(new Float32Array(N), 1);
for (const [k, v] of Object.entries({ aDraw, aSag, aRad, aGlow })) { v.setUsage(DynamicDrawUsage); unit.setAttribute(k, v); }
const tmat = new MeshStandardMaterial({ roughness: 0.45 });
tmat.onBeforeCompile = (s) => {
  s.vertexShader = s.vertexShader
    .replace('#include <common>', '#include <common>\nattribute float aDraw; attribute float aSag; attribute float aRad; attribute float aGlow; varying float vT; varying float vDraw; varying float vGlow;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvT = position.x; vDraw = aDraw; vGlow = aGlow;\ntransformed.yz *= aRad;\ntransformed.y -= sin(3.14159265 * position.x) * aSag;');
  s.fragmentShader = s.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying float vT; varying float vDraw; varying float vGlow;')
    .replace('#include <clipping_planes_fragment>', 'if (vDraw < 0.001 || vT > vDraw) discard;\n#include <clipping_planes_fragment>')
    .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vColor.rgb * vGlow;');
};
const tmesh = new InstancedMesh(unit, tmat, N); tmesh.instanceMatrix.setUsage(DynamicDrawUsage); tmesh.frustumCulled = false;
threads.forEach((_, i) => tmesh.setColorAt(i, WARM)); world.add(tmesh);

const pulseBeads = Array.from({ length: 6 }, () => { const m = new Mesh(new SphereGeometry(0.095, 16, 12), new MeshBasicMaterial({ color: SUN })); m.visible = false; world.add(m); return { m, s: glowSprite(0) }; });

// ---- simulation
const approach = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
const easeOut = (x) => 1 - (1 - x) ** 3;
const sagOf = (a, b, len) => (0.14 + 0.07 * len) * (1 + 0.14 * Math.sin(T * 0.9 + (a.i + b.i) * 1.3));
const UP = new Vector3(0, 1, 0), M = new Matrix4(), X = new Vector3(), Z = new Vector3(), P = new Vector3(), C = new Color();
function arcPoint(out, a, b, u) { const len = Math.hypot(b.x - a.x, b.z - a.z); out.copy(a.chest).lerp(b.chest, u); out.y -= Math.sin(Math.PI * u) * sagOf(a, b, len); return out; }

function step(dt) {
  T += dt;
  while (events.length && events[0].t <= T) events.shift().fn();
  for (const p of people) {
    p.rise = approach(p.rise, p.riseT, dt * 1.5); p.flash = Math.max(0, p.flash - dt * 0.7);
    p.goal = p.goal > p.goalT ? Math.max(p.goalT, p.goal - dt * 0.35) : p.goal;
  }
  for (const t of threads) {
    t.draw = approach(t.draw, t.drawT, dt * t.drawSpd); t.warm = approach(t.warm, t.warmT, dt * t.warmSpd);
    t.flash = Math.max(0, t.flash - dt * 0.6); t.gold = t.draw > 0.99 ? Math.max(0, t.gold - dt * 0.3) : t.gold;
  }
  for (let i = pulses.length - 1; i >= 0; i--) { const pl = pulses[i]; if ((T - pl.t0) / pl.dur >= 1) { pulses.splice(i, 1); pl.onArrive && pl.onArrive(); } }
}

let ptrX = 0, ptrY = 0, tiltX = 0, tiltY = 0;
addEventListener('pointermove', (e) => { ptrX = e.clientX / innerWidth * 2 - 1; ptrY = e.clientY / innerHeight * 2 - 1; });

function paint() {
  tiltX += (ptrX - tiltX) * 0.04; tiltY += (ptrY - tiltY) * 0.04;
  world.rotation.y = Math.sin(T * 0.07) * 0.16 + tiltX * 0.22; world.rotation.x = tiltY * 0.04;
  for (const p of people) {
    const r = easeOut(p.rise), s = p.scale * Math.max(0.0001, r), bob = Math.sin(T * 1.1 + p.phase) * 0.02 * r;
    p.g.position.set(p.x, (1 - r) * -0.35 + bob, p.z); p.g.scale.setScalar(s); p.g.visible = r > 0.001;
    p.shadow.position.set(p.x, 0.006, p.z); p.shadow.scale.setScalar(s); p.shadow.visible = p.g.visible;
    p.chest.set(p.x, p.g.position.y + 0.5 * s, p.z);
    const warm = p.i === 0 ? 1 : (mine[p.name].draw > 0.5 ? mine[p.name].warm : 0.6);
    C.copy(p.base).lerp(FADED, (1 - warm) * 0.68).lerp(SUN, p.flash * 0.35); p.mat.color.copy(C);
    p.flashS.position.copy(p.chest); p.flashS.scale.setScalar(1.6 * easeOut(p.flash));
    const head = new Vector3(p.x, p.g.position.y + 1.18 * s, p.z);
    p.goalS.position.copy(head); p.goalS.scale.setScalar(p.goal > 0 ? 0.35 + 1.4 * p.goal : 0);
    p.goalBead.position.copy(head); p.goalBead.visible = p.goal > 0; p.goalBead.scale.setScalar(0.6 + 0.6 * p.goal);
  }
  youGlow.position.copy(by.You.chest); youGlow.scale.setScalar(1.7 + 0.2 * Math.sin(T * 1.1));
  threads.forEach((t, i) => {
    const a = t.a, b = t.b, len = Math.hypot(b.x - a.x, b.z - a.z);
    let warm = t.warm; if (t.kind !== 'mine') { const wa = a.i ? mine[a.name].warm : 1, wb = mine[b.name].warm; warm = Math.min(wa, wb) * 0.8 + 0.1; }
    const vis = Math.min(a.rise, b.rise) > 0.6 ? t.draw : 0;
    X.subVectors(b.chest, a.chest); Z.crossVectors(X, UP).normalize();
    M.makeBasis(X, UP, Z).setPosition(a.chest); tmesh.setMatrixAt(i, M);
    aDraw.array[i] = vis; aSag.array[i] = sagOf(a, b, len);
    aRad.array[i] = (t.kind === 'knows' ? 0.009 : 0.011) + 0.012 * warm + 0.012 * t.gold;
    aGlow.array[i] = 0.06 + 0.45 * warm + 0.9 * t.flash + 0.9 * t.gold;
    C.copy(FADED).lerp(WARM, warm).lerp(SUN, Math.max(t.gold, t.flash * 0.5)); tmesh.setColorAt(i, C);
  });
  tmesh.instanceMatrix.needsUpdate = true; tmesh.instanceColor.needsUpdate = true;
  for (const v of [aDraw, aSag, aRad, aGlow]) v.needsUpdate = true;
  pulseBeads.forEach((pb, i) => {
    const pl = pulses[i]; pb.m.visible = !!pl; pb.s.scale.setScalar(pl ? 1.6 : 0); if (!pl) return;
    const u = Math.min(1, (T - pl.t0) / pl.dur), e = u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
    arcPoint(P, pl.a, pl.b, e); pb.m.position.copy(P); pb.s.position.copy(P);
  });
  renderer.render(scene, camera);
}

function size() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
size(); addEventListener('resize', size);

const still = q.has('t') || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) {
  const target = q.has('t') ? Number(q.get('t')) : 24;
  if (q.has('px')) { ptrX = tiltX = Number(q.get('px')); }
  while (T < target) step(1 / 60);
  paint(); window.__ready = true;
} else {
  let last = performance.now();
  const loop = (now) => { step(Math.min(0.05, (now - last) / 1000)); last = now; paint(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop); window.__ready = true;
}
</script>
</body>
</html>
