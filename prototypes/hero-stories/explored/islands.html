const sh = new Shape(); sh.moveTo(-0.36, 0.12); sh.lineTo(0.34, 0.78); sh.quadraticCurveTo(0.27, 0.42, 0.24, 0.12); sh.lineTo(-0.36, 0.12);
const sail = new Mesh(new ShapeGeometry(sh, 12), dmat.sail); const sailArm = new Group(); sailArm.position.x = 0.06; sail.position.x = -0.06; sailArm.rotation.y = 0.75; sailArm.add(sail); dhow.add(sailArm);
const dLamp = new Mesh(new SphereGeometry(0.035, 12, 8), new MeshBasicMaterial({ color: C.sun })); dLamp.position.set(-0.46, 0.18, 0); dhow.add(dLamp);
const dGlow = glowSprite(dhow, 1.1); dGlow.position.copy(dLamp.position);
dhow.scale.setScalar(1.45); scene.add(dhow);
const dStreak = streakSprite(0.9);
const ropeMat = new MeshBasicMaterial({ color: C.sun });
const rope = new Mesh(new TubeGeometry(new CatmullRomCurve3([new Vector3(), new Vector3(0.1, 0, 0)]), 2, 0.012, 5), ropeMat); rope.visible = false; scene.add(rope);
const WAKE = 28;
const wake = Array.from({ length: WAKE }, () => { const m = new Mesh(new PlaneGeometry(1, 1), new MeshBasicMaterial({ map: puffTex, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.visible = false; scene.add(m); return { m, p: new Vector3(), age: 99 }; });
let wakeI = 0, wakeClock = 0;

// ---- bridges of light: planks along an arch, lanterns lighting one by one
const bridges = [];
function makeBridge(a, b) {
  const pa = a.home.clone(), pb = b.home.clone(), dir = pb.clone().sub(pa).normalize();
  const s = pa.clone().addScaledVector(dir, a.r * 0.78).setY(0.1), e = pb.clone().addScaledVector(dir, -b.r * 0.78).setY(0.1);
  const mid = s.clone().lerp(e, 0.5); mid.y = 0.1 + s.distanceTo(e) * 0.16;
  const curve = new QuadraticBezierCurve3(s, mid, e);
  const N = Math.max(10, Math.round(s.distanceTo(e) / 0.16));
  const g = new Group(), planks = [], lamps = [];
  const pmat = new MeshStandardMaterial({ color: C.sail, roughness: 0.8, emissive: C.glow.clone(), emissiveIntensity: 0.12 });
  for (let i = 0; i < N; i++) {
    const t = (i + 0.5) / N, p = curve.getPoint(t), tan = curve.getTangent(t);
    const pl = new Mesh(boxG, pmat); pl.scale.set(0.11, 0.025, 0.26); pl.position.copy(p);
    pl.rotation.y = Math.atan2(-tan.z, tan.x); pl.rotation.z = Math.asin(tan.y);
    pl.visible = false; g.add(pl); planks.push(pl);
    if (i % 3 === 1) { const l = new Mesh(new SphereGeometry(0.04, 10, 8), new MeshBasicMaterial({ color: C.sun })); l.position.copy(p).add(new Vector3(0, 0.14, 0)); l.visible = false; g.add(l); const gl = glowSprite(l, 0.6); lamps.push({ l, gl, t }); }
  }
  scene.add(g);
  const br = { a, b, planks, lamps, build: 0, buildT: 0, pmat }; bridges.push(br); return br;
}

// ---- sky lanterns: the goal reached, a small light rising from the new island
const lanterns = [];
function skyLantern(isle) {
  const m = new Mesh(new BoxGeometry(0.09, 0.12, 0.09), new MeshBasicMaterial({ color: new Color('#FFE2A6') }));
  const g = new Group(); g.add(m); const gl = glowSprite(g, 1.2); scene.add(g);
  lanterns.push({ g, gl, t0: T, x: isle.home.x, z: isle.home.z, y0: isle.r * 0.7 });
}

// ---- simulation
let T = 0; const events = [];
const at = (t, fn) => { events.push({ t, fn }); events.sort((x, y) => x.t - y.t); };
const D = { mode: 'docked', from: DOCK.clone(), to: DOCK.clone(), ctrl: DOCK.clone(), t0: 0, dur: 1, target: null, pos: DOCK.clone(), head: 0.6, onDone: null };
const bridged = new Set();

function sailTo(to, dur, onDone, bend = 1.2) {
  D.from.copy(D.pos); D.to.copy(to); D.t0 = T; D.dur = dur; D.onDone = onDone; D.mode = 'sail';
  const mid = D.from.clone().lerp(D.to, 0.5), dir = D.to.clone().sub(D.from); const perp = new Vector3(-dir.z, 0, dir.x).normalize();
  D.ctrl.copy(mid).addScaledVector(perp, bend);
}
function towHome(isle) {
  const from = isle.pos.clone(), to = isle.home.clone(), dir = to.clone().sub(from).normalize();
  D.mode = 'tow'; D.t0 = T; D.dur = Math.max(4, from.distanceTo(to) / 1.3); D.target = isle; D.towFrom = from; D.towTo = to; D.towDir = dir;
  isle.state = 'towed';
}
function startDrift(isle) { isle.state = 'drifting'; isle.driftT = 1; isle.warmT = 0.12; }

// growth: the islands rise around you one by one, each house lights up
isles.forEach((s) => { if (s.join && s.join > 0) { at(s.join, () => { s.riseT = 1; }); at(s.join + 0.7, () => { s.flash = 0.8; }); } });
at(6.6, () => startDrift(byId.G));
at(7.4, () => startDrift(byId.H));

const FIRST = 11.5, CYCLE = 17;
function cycle(k) {
  const tc = FIRST + k * CYCLE;
  // the assistant: the dhow sails out to an island that drifted, and tows it home
  at(tc, () => {
    const isle = isles.find((s) => s.state === 'drifted' || s.state === 'drifting');
    if (!isle) return;
    isle.state = 'hailed';
    const toward = isle.home.clone().sub(isle.pos).normalize();
    const arrive = isle.pos.clone().addScaledVector(toward, isle.r + 0.95);
    sailTo(arrive, Math.max(3, D.pos.distanceTo(arrive) / 2.4), () => { at(T + 0.5, () => towHome(isle)); });
  });
  // a goal: a new island rises beyond a friend's, and a bridge of light forms between them
  at(tc + 8.5, () => {
    const pair = INTROS[k]; if (!pair) return;
    const [via, who] = pair.map((id) => byId[id]);
    if (via.state !== 'home') return;
    who.riseT = 1; bridged.add(via.id); bridged.add(who.id);
    const br = makeBridge(via, who); at(T + 1.2, () => { br.buildT = 1; });
    at(T + 3.6, () => { who.flash = 1.4; skyLantern(who); });
  });
  // time keeps passing: another island starts to drift
  at(tc + 13, () => {
    const s = DRIFT_ORDER.map((id) => byId[id]).filter((x) => x.state === 'home' && !bridged.has(x.id));
    if (s.length) startDrift(s[k % s.length]);
  });
  at(tc + CYCLE - 0.2, () => cycle(k + 1));
}
cycle(0);

const tmp = new Vector3(), tmp2 = new Vector3();
function step(dt) {
  T += dt;
  while (events.length && events[0].t <= T) events.shift().fn();
  for (const s of isles) {
    s.rise = approach(s.rise, s.riseT, dt * 0.55);
    s.flash = Math.max(0, s.flash - dt * 0.6);
    if (s.state === 'drifting' || s.state === 'drifted') {
      s.drift = approach(s.drift, 1, dt / 7); if (s.drift >= 1) s.state = 'drifted';
      s.pos.copy(s.home).addScaledVector(s.out, 10 * easeIO(s.drift));
      s.pos.x += Math.sin(s.drift * 3) * 0.5 * s.drift;
    }
    s.warm = approach(s.warm, s.warmT, dt * (s.warmT > s.warm ? 0.9 : 0.16));
  }
  // dhow
  const was = D.pos.clone();
  if (D.mode === 'sail') {
    const u = clamp01((T - D.t0) / D.dur), e = easeIO(u);
    const a = D.from.clone().lerp(D.ctrl, e), b = D.ctrl.clone().lerp(D.to, e); D.pos.copy(a.lerp(b, e));
    if (u >= 1) { D.mode = 'wait'; const f = D.onDone; D.onDone = null; f && f(); }
  } else if (D.mode === 'tow') {
    const s = D.target, u = clamp01((T - D.t0) / D.dur), e = easeIO(u);
    s.pos.copy(D.towFrom).lerp(D.towTo, e);
    D.pos.copy(s.pos).addScaledVector(D.towDir, s.r + 0.95);
    if (u > 0.55) s.warmT = 1;
    if (u >= 1) {
      s.state = 'home'; s.drift = 0; s.driftT = 0; s.flash = 1.3; s.warmT = 1;
      D.mode = 'wait'; D.target = null;
      at(T + 0.8, () => sailTo(DOCK, Math.max(2.5, D.pos.distanceTo(DOCK) / 2.4), () => { D.mode = 'docked'; }, -1.0));
    }
  }
  const mv = D.pos.clone().sub(was);
  if (mv.lengthSq() > 1e-7) D.head = Math.atan2(-mv.z, mv.x);
  D.speed = mv.length() / Math.max(dt, 1e-4);
  wakeClock += dt;
  if (wakeClock > 0.11) { wakeClock = 0; if (D.speed > 0.4) { const w = wake[wakeI++ % WAKE]; w.p.copy(D.pos); w.age = 0; } }
  for (const w of wake) w.age += dt;
  for (const br of bridges) br.build = approach(br.build, br.buildT, dt / 2.2);
}

// ---- paint
let ptrX = 0, ptrY = 0, tX = 0, tY = 0;
addEventListener('pointermove', (e) => { ptrX = e.clientX / innerWidth * 2 - 1; ptrY = e.clientY / innerHeight * 2 - 1; });
const camPos = new Vector3();
function paint() {
  tX += (ptrX - tX) * 0.035; tY += (ptrY - tY) * 0.035;
  camPos.copy(CAM); camPos.x += tX * 0.9 + Math.sin(T * 0.05) * 0.4; camPos.y += -tY * 0.25;
  camera.position.copy(camPos); camera.lookAt(LOOK);
  sky.position.copy(camPos);
  waterU.uT.value = T; waterU.uCam.value.copy(camPos);
  for (const s of isles) {
    const r = easeOut(s.rise);
    const bob = waveAt(s.pos.x, s.pos.z, T) * 0.8;
    s.g.position.set(s.pos.x, (1 - r) * -1.1 * s.r + bob - 0.02, s.pos.z);
    s.g.rotation.set(Math.sin(T * 0.7 + s.phase) * 0.02, s.spin * 0.1 + s.drift * 0.6, Math.cos(T * 0.6 + s.phase) * 0.02);
    s.g.visible = s.rise > 0.001;
    s.foam.position.set(s.pos.x, 0.035 + bob * 0.5, s.pos.z); s.foam.visible = s.g.visible;
    s.foam.material.opacity = r * (0.75 + 0.25 * Math.sin(T * 1.3 + s.phase));
    const w = s.warm * clamp01((s.rise - 0.75) * 4);
    const fade = (1 - s.warm) * 0.55;
    s.mats.sand.color.copy(C.sand).lerp(C.faded, fade); s.mats.green.color.copy(C.green).lerp(C.faded, fade);
    s.mats.wall.color.copy(C.wall).lerp(C.faded, fade * 0.8);
    s.mats.win.color.copy(C.faded).multiplyScalar(0.55).lerp(C.sun, w);
    const dist = s.g.position.distanceTo(camPos), fog = clamp01((dist - FOG_NEAR) / (FOG_FAR - FOG_NEAR));
    const lampK = (w * 0.85 + s.flash * 0.9) * (1 - fog * 0.85);
    s.lamp.material.opacity = Math.min(1, lampK); s.lamp.scale.setScalar(s.lamp.userData.base * (0.8 + 0.5 * s.flash + 0.06 * Math.sin(T * 2 + s.phase)));
    s.streak.position.set(s.pos.x + s.r * 0.15, 0.04, s.pos.z + s.r * 0.6); s.streak.material.opacity = 0.4 * lampK; s.streak.visible = s.g.visible;
  }
  // dhow
  const dBob = waveAt(D.pos.x, D.pos.z, T);
  dhow.position.set(D.pos.x, 0.06 + dBob, D.pos.z);
  dhow.rotation.set(Math.sin(T * 1.3) * 0.05, D.head, Math.sin(T * 0.9) * 0.04);
  dStreak.position.set(D.pos.x, 0.03, D.pos.z + 0.3); dStreak.material.opacity = 0.5;
  dGlow.scale.setScalar(1.1 + 0.08 * Math.sin(T * 3));
  for (const w of wake) {
    const a = w.age / 3.2; w.m.visible = a < 1;
    if (a < 1) { w.m.position.set(w.p.x, 0.04, w.p.z); w.m.scale.setScalar(0.35 + a * 1.6); w.m.material.opacity = (1 - a) * 0.7; }
  }
  if (D.mode === 'tow' && D.target) {
    const s = D.target;
    const stern = new Vector3(-0.46 * 1.45, 0.2, 0).applyAxisAngle(new Vector3(0, 1, 0), D.head).add(dhow.position);
    const edge = s.g.position.clone().addScaledVector(D.towDir, s.r * 0.85); edge.y = 0.12;
    const mid = stern.clone().lerp(edge, 0.5); mid.y -= 0.12;
    rope.geometry.dispose(); rope.geometry = new TubeGeometry(new CatmullRomCurve3([stern, mid, edge]), 16, 0.024, 6); rope.visible = true;
  } else rope.visible = false;
  for (const br of bridges) {
    const n = br.planks.length, k = Math.floor(easeIO(br.build) * n);
    br.planks.forEach((p, i) => { p.visible = i < k; });
    br.lamps.forEach((l) => { const on = clamp01((br.build - l.t) * 4); l.l.visible = on > 0; l.gl.material.opacity = on * (0.45 + 0.1 * Math.sin(T * 2 + l.t * 9)); });
    br.pmat.emissiveIntensity = 0.12 + 0.25 * br.build;
  }
  for (const L of lanterns) {
    const a = (T - L.t0) / 9; L.g.visible = a < 1;
    if (a < 1) { L.g.position.set(L.x + Math.sin(a * 5) * 0.15, L.y0 + a * 4.2, L.z); L.gl.material.opacity = Math.min(1, a * 6) * (1 - a); L.g.children[0].material.opacity = 1 - a; L.g.children[0].material.transparent = true; }
  }
  renderer.render(scene, camera);
}

function size() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false); camera.aspect = W / H;
  if (phone) camera.setViewOffset(W, H, 0, -H * 0.2, W, H); else camera.setViewOffset(W, H, -W * 0.17, -H * 0.02, W, H);
  camera.updateProjectionMatrix();
}
size(); addEventListener('resize', size);

const still = q.has('t') || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) {
  const target = q.has('t') ? Number(q.get('t')) : 32;
  while (T < target) step(1 / 60);
  paint(); window.__ready = true;
} else {
  let last = performance.now();
  const loop = (now) => { step(Math.min(0.05, (now - last) / 1000)); last = now; paint(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop); window.__ready = true;
}
</script>
</body>
</html>
