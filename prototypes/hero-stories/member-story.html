  const bubbleAt = head.clone().add(new Vector3(0.05, 0.62, 0));
  const read = bump(t, 24.6, 26.2, 0.3);
  drawVisor(lead, T, (t > 49.6 && t < 54) ? 'smile' : 'think');
  if (read > 0) setTube(beam, new QuadraticBezierCurve3(lp.clone().add(new Vector3(-0.15, -0.1, 0.1)), lp.clone().lerp(bubbleAt, 0.5).add(new Vector3(0, 0.3, 0)), bubbleAt.clone().add(new Vector3(0.2, 0.25, 0))), ease(span(t, 24.6, 25.1)), 0.006); else beam.visible = false;
  beam.material.opacity = read;
  helpers.forEach((hb, i) => {
    const k = easeOut(span(t, 25.6 + i * 0.2, 26.9 + i * 0.2)), back = ease(span(t, 33.2 + i * 0.1, 34.2 + i * 0.1));
    const p = lp.clone().lerp(HELP_AT[i], k).lerp(lp, back); p.y += Math.sin(T * 2 + i) * 0.03;
    placeBot(hb, p, mix(0.2, 1, k) * (k > 0 ? 1 : 0) * (1 - back * 0.8) * (back < 1 ? 1 : 0), T, i * 1.7);
    hb.g.rotation.y += -0.5;
    drawVisor(hb, T, 'icon');
    pin(skillEls[i], p.clone().add(new Vector3(0, -0.26, 0)), k > 0 && back < 1 ? ease(span(t, 26.6 + i * 0.2, 27.1 + i * 0.2)) * (1 - back) : 0, -50, 0);
  });
  // ropes: thrown, pulled taut, hauled, let go
  ropes.forEach(({ r, m }) => {
    const R = ROPE(r.rope), hb = helpers[r.helper];
    const throwK = ease(span(t, ...R.throw)), rel = ease(span(t, ...R.rel));
    if (throwK <= 0 || rel >= 1) { m.visible = false; return; }
    const port = hb.g.position.clone().add(new Vector3(-0.15 * hb.scale, -0.05, 0.05));
    const end = phoneLocal(SCW / 2 - 0.3, pxY(slotY(r)), SZ + 0.05);
    const tense = ease(span(t, ...R.tense)), pull = ease(span(t, ...R.pull));
    const len = port.distanceTo(end), sag = len * (0.32 * (1 - tense) + 0.04 * (1 - pull)) + 0.01;
    const mid = port.clone().lerp(end, 0.5); mid.y -= sag;
    if (pull > 0) { const tug = Math.sin(pull * Math.PI * 4) * 0.03 * (1 - pull); mid.y += tug; }
    const from = port.clone(), to = end.clone(); if (rel > 0) to.lerp(from, rel);
    setTube(m, new QuadraticBezierCurve3(from, mid, to), throwK, 0.013);
  });

  // suggestion cards: from the node, with a short line
  let fi = -1, fk = 0; FOCUS.forEach((f, i) => { const k = bump(t, f.t, f.t + 2.0, 0.45); if (k > fk) { fk = k; fi = i; } });
  if (fi >= 0 && fk > 0.001) {
    drawFocus(fi); const src = ROWS.find((r) => r.id === FOCUS[fi].row), node = gWorld(src.node);
    const CARD_AT = narrow() ? GC.clone().add(new Vector3(0, -1.75, 1.2)) : GC.clone().add(new Vector3(1.6, 1.0, 0.9));
    focusM.visible = true; focusM.position.copy(node).lerp(CARD_AT, easeOut(fk)); focusM.scale.setScalar(mix(0.25, narrow() ? 1.0 : 1, fk)); focusM.material.opacity = ease(clamp(fk * 1.5)); focusM.quaternion.set(0, 0, 0, 1);
    const edgePt = focusM.position.clone().add(new Vector3(-FOCUS_W / 2 * focusM.scale.x + 0.05, 0, 0));
    focusLine.material.opacity = ease(clamp(fk * 1.5)) * 0.9;
    setTube(focusLine, new QuadraticBezierCurve3(node, node.clone().lerp(edgePt, 0.5).add(new Vector3(0, -0.12, 0)), edgePt), 1, 0.008);
  } else { focusM.visible = false; focusLine.visible = false; }

  placeCrowd(t);

  // ---- overlays
  const cap2 = [['1 week later', 10.4, 12.7], ['1 month later', 12.8, 15.5], ['3 months later', 15.6, 18.5], ['6 months later', 18.6, 22.3]];
  const cap5 = [['Week 1', 44.5, 46.3], ['Month 1', 46.4, 48.1], ['Month 3', 48.2, 49.9], ['Month 6 — still close', 50.0, 53.8]];
  let capTxt = '', capOp = 0, capWarm = false;
  for (const [s, a, b] of cap2) if (t >= a && t < b) { capTxt = s; capOp = bump(t, a, b, 0.25); }
  for (const [s, a, b] of cap5) if (t >= a && t < b) { capTxt = s; capOp = bump(t, a, b, 0.25); capWarm = true; }
  if (capTxt && capEl.textContent !== capTxt) capEl.textContent = capTxt;
  capEl.classList.toggle('warm', capWarm);
  if (capWarm) pin(capEl, gWorld(NODES.you).add(new Vector3(0, narrow() ? 2.25 : 2.35, 0)), capOp, -50, -100, 'rotate(-2deg)');
  else pin(capEl, phoneLocal(-SCW / 2 + 0.05, SCH / 2 + 0.12), capOp, 0, -100, 'rotate(-3deg)');
  const bOp = bump(t, 18.3, 34.0, 0.4) + bump(t, 48.6, 54.2, 0.4);
  const done = t > 49.6;
  if (bubbleEl.dataset.k !== String(done)) { bubbleEl.innerHTML = done ? '<div class="h">Your goal</div><span class="tick">✓</span>Intro to Qamar Bank — done' : '<div class="h">Thinking…</div>Need an intro to Qamar Bank'; bubbleEl.dataset.k = String(done); }
  bubbleEl.classList.toggle('glow', read > 0.2 || bump(t, 49.6, 51.2, 0.3) > 0.2);
  pin(bubbleEl, bubbleAt, Math.min(1, bOp), -18, -100);
  for (const k in hubEls) {
    const t0 = k === 'you' ? 34.9 : (k === 'Work' || k === 'Personal') ? 35.3 : 35.8;
    const op = ease(span(t, t0, t0 + 0.5)) * gOut;
    const below = k === 'you' ? -0.25 : (k === 'Work' || k === 'Personal') ? 0.17 : 0.13;
    pin(hubEls[k], gWorld(NODES[k]).add(new Vector3(0, k === 'you' ? -0.24 : below, 0.05)), op, -50, k === 'you' ? 0 : -100);
  }
  GROUPS.forEach((g, i) => { const a = 57.6 + i * 0.75; pin(statEls[i], new Vector3(g.at[0], 1.9, g.at[1]), ease(span(t, a, a + 0.45)) * (1 - ease(span(t, 64.6, 65.4))), -50, -100, `scale(${mix(0.85, 1, easeOut(span(t, a, a + 0.45))).toFixed(3)})`); });

  renderer.render(scene, camera);
}
const phoneVis = (t) => t < 35.5;

function size() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
size(); addEventListener('resize', size);

// ---- controls
let T = 0, paused = false;
const scenesEl = document.getElementById('scenes');
const still = q.has('t') || reduced;
NAMES.forEach((n, i) => { const b = document.createElement('button'); b.dataset.i = i; b.textContent = `${i + 1} ${n}`; b.onclick = () => { T = still ? KEY[i] : SC[i] + 0.05; if (still) { lastCopy = -2; paint(T, true); } }; scenesEl.appendChild(b); });
const pp = document.createElement('button'); pp.className = 'pp'; pp.textContent = '❚❚'; pp.setAttribute('aria-label', 'Pause'); pp.onclick = () => { paused = !paused; pp.textContent = paused ? '▶' : '❚❚'; pp.setAttribute('aria-label', paused ? 'Play' : 'Pause'); };
if (!still) scenesEl.appendChild(pp);

await Promise.race([Promise.all(['600 34px Inter', '400 24px Inter', '700 54px Inter', '700 30px Caveat'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]);
if (still) {
  T = q.has('t') ? Number(q.get('t')) : KEY[q.has('scene') ? Number(q.get('scene')) - 1 : 0];
  if (q.has('px')) ptrX = tiltX = Number(q.get('px'));
  paint(T, true); window.__ready = true;
} else {
  if (q.has('scene')) T = SC[Number(q.get('scene')) - 1] + 0.05;
  const STEP = 1 / 60; let last = performance.now(), acc = 0;
  const loop = (now) => { const dt = Math.min(0.25, (now - last) / 1000); last = now; if (!paused) { acc += dt; while (acc >= STEP) { T += STEP; acc -= STEP; } } paint(T, false); requestAnimationFrame(loop); };
  requestAnimationFrame(loop); window.__ready = true;
}
</script>
