const N = CARDS.length;
CARDS.forEach((c, i) => {
  const tex = new CanvasTexture(drawCard(c, i)); tex.colorSpace = SRGBColorSpace; tex.anisotropy = 8;
  const nt = new CanvasTexture(drawNote(c.note, i, c.layout));
  const paperHex = PAPER[c.paper][0];
  const top = cardMaterial(tex, nt, paperHex), e = edgeMat(paperHex);
  const mesh = new Mesh(cardGeo, [e, e, top, e, e, e]); mesh.castShadow = true; mesh.receiveShadow = true;
  // the heap: early cards spread wide, later cards land nearer the middle
  const k = i / (N - 1), rad = lerp(1.25, 0.25, k) * (0.55 + rnd() * 0.45), ang = rnd() * Math.PI * 2;
  const target = { x: Math.cos(ang) * rad, z: Math.sin(ang) * rad * 0.8, y: 0.03 + i * 0.02, ry: (rnd() - 0.5) * 1.9, rx: (rnd() - 0.5) * 0.012, rz: (rnd() - 0.5) * 0.012 };
  if (c.hero) Object.assign(target, { x: 0.12, z: 0.18, ry: 0.16, rx: 0, rz: 0, y: 0.03 + i * 0.02 + 0.02 });
  const drop = 0.5 + i * 0.2;
  cards.push({ c, mesh, top, target, drop, from: { x: target.x + (rnd() - 0.5) * 0.8, z: target.z - 0.6 - rnd() * 0.5, ry: target.ry + (rnd() - 0.5) * 1.6, rx: (rnd() - 0.5) * 0.9 },
    fadeAt: 6.6 + rnd() * 3.2, slide: null });
  world.add(mesh);
});
// a few edge cards slide off into the dark as the months pass
const outer = cards.map((cd, i) => ({ i, r: Math.hypot(cd.target.x, cd.target.z) })).filter((o) => o.i < N - 6 && cards[o.i].target.z < 0.35).sort((a, b) => b.r - a.r).slice(0, 4);
outer.forEach((o, j) => { const cd = cards[o.i], a = Math.atan2(cd.target.z, cd.target.x); cd.slide = { at: 11.2 + j * 1.5, dx: Math.sign(Math.cos(a) || 1) * (1.6 + rnd() * 0.8), dz: -1.9 - rnd() * 1.0, spin: (rnd() - 0.5) * 1.2 }; });

// the visitor badge and its lanyard, under the pile
const badgeTex = new CanvasTexture(drawBadge()); badgeTex.colorSpace = SRGBColorSpace; badgeTex.anisotropy = 8;
const badgeTop = cardMaterial(badgeTex, new CanvasTexture(drawNote('', 0)), '#F7F5F0');
const badge = new Mesh(new BoxGeometry(0.92, 0.018, 1.31), [edgeMat('#E8E6E0'), edgeMat('#E8E6E0'), badgeTop, edgeMat('#E8E6E0'), edgeMat('#E8E6E0'), edgeMat('#E8E6E0')]);
badge.castShadow = badge.receiveShadow = true; badge.position.set(-1.05, 0.012, 0.55); badge.rotation.set(0, 0.5, 0); world.add(badge);
const lanyardPts = [[-1.25, 1.12], [-1.55, 1.5], [-2.15, 1.55], [-2.55, 1.1], [-2.35, 0.55], [-2.75, 0.05], [-3.3, -0.1]].map(([x, z]) => new Vector3(x, 0.012, z));
const lanyardGeo = new TubeGeometry(new CatmullRomCurve3(lanyardPts), 160, 0.06, 6); lanyardGeo.scale(1, 0.18, 1);
const lanyard = new Mesh(lanyardGeo, new MeshStandardMaterial({ color: 0x1d2c48, roughness: 0.75 })); lanyard.castShadow = lanyard.receiveShadow = true; world.add(lanyard);

// dust in the light
const DN = 260, dpos = new Float32Array(DN * 3), dseed = [];
for (let i = 0; i < DN; i++) { dseed.push([rnd() * 4 - 2, rnd() * 3.5, rnd() * 3 - 1.5, rnd()]); }
const dustGeo = new BufferGeometry(); dustGeo.setAttribute('position', new Float32BufferAttribute(dpos, 3));
const dust = new Points(dustGeo, new PointsMaterial({ color: 0xfff1d8, size: 0.022, transparent: true, opacity: 0, depthWrite: false, blending: AdditiveBlending })); world.add(dust);

// the one card that warms: a soft glow under it
const glowTex = radial([[0, 'rgba(120,230,215,.9)'], [0.4, 'rgba(80,200,190,.25)'], [1, 'rgba(80,200,190,0)']]);
const glow = new Sprite(new SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: AdditiveBlending, opacity: 0 })); glow.scale.set(2.4, 1.5, 1); glow.material.depthTest = false; glow.renderOrder = -1; world.add(glow);

// ---- the loop: drop, time passes, fade, one card warms, dark, again
const L = 27;
const WHEN = [[7, 'a week later'], [9.6, 'a month later'], [12.2, 'three months later'], [14.8, 'six months later']];
const whenEl = document.getElementById('when'), cueEl = document.getElementById('cue');
let ptrX = 0, ptrY = 0, tiltX = 0, tiltY = 0;
addEventListener('pointermove', (e) => { ptrX = e.clientX / innerWidth * 2 - 1; ptrY = e.clientY / innerHeight * 2 - 1; });

function frame(T, smoothTilt = true) {
  const t = T % L;
  if (smoothTilt) { tiltX += (ptrX - tiltX) * 0.05; tiltY += (ptrY - tiltY) * 0.05; } else { tiltX = ptrX; tiltY = ptrY; }
  world.rotation.y = -0.12 + Math.sin(T * 0.05) * 0.05 + tiltX * 0.12; world.rotation.x = tiltY * 0.03;
  // the camera eases in a touch over the months
  const push = smooth(span(t, 6, 22));
  camera.position.copy(CAM).multiplyScalar(1 - push * 0.07); camera.lookAt(0.05, 0, 0.05);

  // light: up as the cards land, down as the months pass, out before the loop starts again
  const lightUp = smooth(span(t, 0, 1.4)), lightDown = smooth(span(t, 6.5, 17)), out = smooth(span(t, 24, 26.6));
  const L1 = lightUp * (1 - 0.62 * lightDown) * (1 - out);
  key.intensity = 70 * L1; hemi.intensity = 0.5 * (0.3 + 0.7 * L1);
  pool.material.opacity = 0.25 + 0.75 * L1; floor.material.opacity = 0.5 * L1 + 0.05;

  const dustA = smooth(span(t, 7, 16)) * (1 - out);
  const warmA = smooth(span(t, 18.2, 20.6)) * (1 - smooth(span(t, 23.6, 25.6)));
  cards.forEach((cd, i) => {
    const { mesh, target, from } = cd, u = cd.top.userData.u;
    const d = span(t, cd.drop, cd.drop + 0.55);
    mesh.visible = t >= cd.drop;
    const fall = d * d; // gravity
    const settle = Math.sin(span(t, cd.drop + 0.55, cd.drop + 0.85) * Math.PI) * 0.012;
    let x = lerp(from.x, target.x, easeOut(d)), z = lerp(from.z, target.z, easeOut(d)), y = lerp(target.y + 2.6, target.y, fall) + settle;
    let ry = lerp(from.ry, target.ry, easeOut(d)), rx = lerp(from.rx, target.rx, easeOut(d)), rz = target.rz;
    if (cd.slide) { const s = easeInOut(span(t, cd.slide.at, cd.slide.at + 2.6)); x += cd.slide.dx * s; z += cd.slide.dz * s; ry += cd.slide.spin * s; y -= 0.25 * s * s; }
    if (cd.c.hero) { y += 0.13 * warmA; rx += -0.05 * warmA; ry += 0.04 * warmA; }
    mesh.position.set(x, y, z); mesh.rotation.set(rx, ry, rz);
    const f = smooth(span(t, cd.fadeAt, cd.fadeAt + 6.5));
    const back = cd.c.hero ? 1 - warmA * 0.9 : 1;
    u.uFade.value = f * back; u.uNoteFade.value = smooth(span(t, cd.fadeAt - 0.8, cd.fadeAt + 4.2)) * back;
    u.uDust.value = dustA * (cd.c.hero ? 1 - warmA : 1); u.uWarm.value = cd.c.hero ? warmA : 0;
  });
  badgeTop.userData.u.uFade.value = smooth(span(t, 7.5, 15)) * 0.6; badgeTop.userData.u.uDust.value = dustA;
  const hero = cards[N - 1].mesh; glow.position.set(hero.position.x, 0.02, hero.position.z + 0.35); glow.material.opacity = 0; pick.target.position.copy(hero.position); pick.intensity = 34 * warmA;

  for (let i = 0; i < DN; i++) {
    const [x, y0, z, ph] = dseed[i]; const y = ((y0 - T * (0.05 + ph * 0.05)) % 3.5 + 3.5) % 3.5;
    dpos[i * 3] = x + Math.sin(T * 0.3 + ph * 9) * 0.08; dpos[i * 3 + 1] = y; dpos[i * 3 + 2] = z + Math.cos(T * 0.25 + ph * 7) * 0.08;
  }
  dustGeo.attributes.position.needsUpdate = true; dust.material.opacity = dustA * 0.75 * (0.4 + 0.6 * L1 / Math.max(0.01, 1 - 0.62 * lightDown));

  // the handwritten "time passes" note, and the scroll cue
  let label = '', la = 0;
  WHEN.forEach(([at, txt], j) => { if (t >= at) { label = txt; const next = WHEN[j + 1] ? WHEN[j + 1][0] : 18; la = smooth(span(t, at, at + 0.6)) * (1 - smooth(span(t, next - 0.5, next))); } });
  whenEl.textContent = label; whenEl.style.opacity = (la * 0.85).toFixed(3);
  cueEl.style.opacity = (0.55 + 0.45 * warmA).toFixed(3); cueEl.style.color = warmA > 0.05 ? `color-mix(in srgb, var(--thread) ${Math.round(warmA * 100)}%, var(--ink))` : '';

  renderer.render(scene, camera);
}

function size() { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
size(); addEventListener('resize', size);

const still = q.has('t') || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) {
  if (q.has('px')) ptrX = Number(q.get('px'));
  frame(q.has('t') ? Number(q.get('t')) : 20.8, false); window.__ready = true;
} else {
  // fixed-step sim clock so the pace survives dropped frames
  let T = 0, acc = 0, last = performance.now(); const STEP = 1 / 60;
  const loop = (now) => { acc += Math.min(0.25, (now - last) / 1000); last = now; while (acc >= STEP) { T += STEP; acc -= STEP; } frame(T); requestAnimationFrame(loop); };
  requestAnimationFrame(loop); window.__ready = true;
}
</script>
</body>
</html>
