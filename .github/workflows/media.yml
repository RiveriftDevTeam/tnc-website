# Fetches the media listed in src/content/media.js into public/media/ and commits it to main.
# Run by hand after the media list changes. The site build itself never downloads anything.
name: Fetch media
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/media.mjs
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - name: Commit the media
        run: |
          git config user.name "RiveriftDevTeam"
          git config user.email "devteam@riverift.com"
          git add public/media
          git commit -m "Media: photos and video for the site (see public/media/CREDITS.md)" || echo "nothing new"
          git push origin HEAD
