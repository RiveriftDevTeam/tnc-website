# Builds the static site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages
# Paused on the founder's ask (2026-10-25): no deploy runs on push. Run it by hand from the Actions tab to publish again,
# or put the `push: branches: [main]` trigger back.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://riveriftdevteam.github.io/tnc-website
          NEXT_PUBLIC_BASE_PATH: /tnc-website
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
