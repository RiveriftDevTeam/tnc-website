# Scouts free photos and videos (Unsplash, Pexels) and pushes thumbnails + an index to the branch `media-scout`,
# so they can be reviewed from an environment that cannot reach those sites. Never publishes anything.
name: Media scout
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/media-scout.mjs
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - name: Push results to the media-scout branch
        run: |
          git config user.name "RiveriftDevTeam"
          git config user.email "devteam@riverift.com"
          git checkout -B media-scout
          git add -f scout
          git commit -m "media scout $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new"
          git push -f origin media-scout
